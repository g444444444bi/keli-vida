const exKey = n => String(n || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
const numv = v => { const n = typeof v === 'number' ? v : parseMoney(v); return isFinite(n) ? n : 0; };
const nowHM = () => { const t = new Date(); return pad(t.getHours()) + ':' + pad(t.getMinutes()); };
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
const EX_TAGS = ['Dor', 'Técnica', 'Fadiga', 'Deload', 'Ajuste da professora', 'Outro'];
const KIND_L = { musculacao: 'Academia', futevolei: 'Futevôlei', cardio: 'Cardio', outro: 'Outro', descanso: 'Descanso' };

/** séries de um exercício: usa setsLog (sessão detalhada) ou cai no formato antigo séries×reps×kg */
function exSets(e) {
  if (Array.isArray(e.setsLog) && e.setsLog.length) return e.setsLog.map(s => ({ kg: numv(s.kg), reps: numv(s.reps), done: !!s.done }));
  const n = +e.sets || 0; return Array.from({ length: n }, () => ({ kg: numv(e.kg), reps: numv(e.reps), done: true }));
}
const exDone = e => exSets(e).filter(s => s.done);

const exMaxKg = e => { const a = exDone(e).map(s => s.kg).filter(x => x > 0); return a.length ? Math.max(...a) : 0; };

const wCmp = (a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')) || (a.recordedAt || 0) - (b.recordedAt || 0) || String(a.id).localeCompare(String(b.id));

function entryOfEx(w, e) {
  const ds = exDone(e), kg = exMaxKg(e), vol = exVolume(e), reps = exReps(e); if (!kg && !vol && !reps) return null;
  const loads = ds.map(s => s.kg).filter(x => x > 0), atMax = ds.filter(s => s.kg === kg);
  return { date: w.date, time: w.time || '', wid: w.id, pid: w.programId || '', kg, minKg: loads.length ? Math.min(...loads) : 0, vol, reps, bestReps: ds.reduce((m, s) => Math.max(m, s.reps), 0), repsAtMax: atMax.reduce((m, s) => Math.max(m, s.reps), 0), sets: ds.length, setsArr: ds, tag: e.tag || '', note: e.note || '' };
}
function exHistory(key, d = D()) {
  const out = [];
  d.workouts.filter(w => w.status !== 'andamento').slice().sort(wCmp).forEach(w => {

}
function exStats(key, d = D()) {
  const h = exHistory(key, d), loads = h.filter(x => x.kg > 0), mins = h.map(x => x.minKg).filter(x => x > 0);
  const last = h[h.length - 1] || null, prev = h.length > 1 ? h[h.length - 2] : null, max = loads.length ? Math.max(...loads.map(x => x.kg)) : 0;
  const first = loads[0] || null, lastLoad = loads[loads.length - 1] || null;
  return { h, last, prev, max, min: mins.length ? Math.min(...mins) : 0, first, lastLoad, sessions: h.length, bestReps: h.reduce((m, x) => Math.max(m, x.bestReps), 0), lastReps: last ? (last.repsAtMax || last.bestReps || 0) : 0, total: first && lastLoad ? r2(lastLoad.kg - first.kg) : 0, vol: r2(sum(h.map(x => x.vol))) };
}
/** compara a sessão atual de um exercício com a anterior (por data do treino): carga primeiro; com a mesma carga, repetições/volume */
function cmpEntry(cur, prev) {

  if (cur.kg > 0 && prev.kg > 0) {
    if (cur.kg > prev.kg) return 'Progressão'; if (cur.kg < prev.kg) return 'Carga reduzida';
    if (cur.repsAtMax > 0 && prev.repsAtMax > 0) return cur.repsAtMax > prev.repsAtMax ? 'Progressão' : 'Mantido';
    if (cur.vol > 0 && prev.vol > 0) return cur.vol > prev.vol ? 'Progressão' : 'Mantido';

}
const cmpStatus = (cur, prev) => !(cur > 0) || !(prev > 0) ? '' : cur > prev ? 'Progressão' : cur === prev ? 'Mantido' : 'Carga reduzida';

function commit(msg) {
  Store.save(); render();
  if (msg) toast(isDemo() ? msg + ' (só na demonstração)' : msg);
}
const addMonthsISO = (iso, n) => { const ym = ymAdd(iso.slice(0, 7), n); return ym + '-' + pad(Math.min(+iso.slice(8), daysIn(ym))); };
const defDate = () => S.ym === curYM() ? todayISO() : S.ym + '-01';

const incCats = () => D().cats.filter(c => c.group === 'renda').map(c => [c.id, c.name]);

/* ---- lançamentos / contas / renda ---- */
function txForm({ id = null, type = 'out', fixed = false, title, rec = false } = {}) {
  const d = D(), t = id ? d.tx.find(x => x.id === id) : null;
  if (id && !t) return;
  const ty = t ? t.type : type, lockType = fixed || !!t;
  const fields = [];
  if (!lockType) fields.push({ k: 'type', label: 'Tipo', type: 'select', opts: [['out', 'Despesa'], ['in', 'Receita']] });
  fields.push(
    { k: 'desc', label: 'Descrição', req: true, ph: ty === 'in' ? 'Ex.: Salário' : 'Ex.: Internet' },
    { k: 'val', label: 'Valor (R$)', type: 'money', pos: true, half: true },
    { k: 'date', label: ty === 'in' ? 'Data de recebimento' : 'Vencimento / data', type: 'date', req: true, half: true },
    { k: 'cat', label: 'Categoria', type: 'select', opts: ty === 'in' ? incCats() : expCats(), half: true },
    { k: 'rec', label: 'Repetição', type: 'select', opts: [['0', 'Só uma vez'], ['1', 'Todo mês']], half: true },
    { k: 'end', label: 'Repetir até (opcional)', type: 'month', hint: 'Deixe em branco para repetir sem fim.' },
  );
  if (!lockType && d.cards.length) fields.push({ k: 'card', label: 'Pago com', type: 'select', opts: [['', 'Débito, Pix ou dinheiro'], ...d.cards.map(c => [c.id, 'Cartão ' + c.name])] }, { k: 'n', label: 'Parcelas no cartão', type: 'number', half: true, hint: 'Valor total dividido em parcelas iguais.' });
  const vals = t ? { ...t, val: t.val, rec: t.rec ? '1' : '0' } : { type: ty, date: defDate(), rec: rec ? '1' : '0', cat: ty === 'in' ? 'salario' : '', n: 1 };
  openForm({
    title: title || (t ? 'Editar lançamento' : 'Novo lançamento financeiro'), sub: t && t.rec ? 'A alteração vale para todos os meses deste lançamento.' : '',
    fields, values: vals, submit: t ? 'Salvar alterações' : 'Salvar',
    setup(form) {
      const sync = () => {
        const tp = lockType ? ty : form.querySelector('#f_type').value, sel = form.querySelector('#f_cat'), cur = sel.value;
        sel.innerHTML = optsHTML(tp === 'in' ? incCats() : expCats(), cur); if (![...sel.options].some(o => o.value === cur)) sel.selectedIndex = 0;
        const card = form.querySelector('#f_card'); const useCard = card && card.value && tp === 'out';
        showFld(form, 'card', tp === 'out'); showFld(form, 'n', !!useCard); showFld(form, 'rec', !useCard); showFld(form, 'end', !useCard && form.querySelector('#f_rec').value === '1');
      };
      ['type', 'card', 'rec'].forEach(k => { const el = form.querySelector('#f_' + k); el && el.addEventListener('change', sync); }); sync();
    },
    onSubmit(v) {
      const tp = lockType ? ty : v.type;
      if (v.card && !t && tp === 'out') { d.buys.push({ id: uid(), card: v.card, desc: v.desc, val: v.val, date: v.date, n: Math.max(1, Math.round(v.n || 1)), cat: v.cat }); commit('Compra lançada no cartão'); return; }
      const rec = v.rec === '1', o = { type: tp, desc: v.desc, val: v.val, date: v.date, cat: v.cat, rec, end: rec ? (v.end || '') : '' };
      if (t) Object.assign(t, o); else d.tx.push({ id: uid(), paid: {}, ...o });
      if (o.date.slice(0, 7) !== S.ym && !rec) S.ym = o.date.slice(0, 7);
      commit(t ? 'Lançamento atualizado' : tp === 'in' ? 'Renda salva' : 'Lançamento salvo');
    },
    onDelete: t ? () => delThing('tx', id) : null,
  });
}

/* ---- foto de perfil (M1): recorte circular, 256×256 JPEG, guardada em settings.photo do contexto ativo ---- */
async function openPhotoCrop(file) {
  if (!file) return;
  if (file.size > 20 * 1048576) { toast('Imagem muito grande (máx. 20 MB).', 'err'); return; }
  let img; try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { try { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); } catch (x) { toast('Não foi possível abrir esta imagem.', 'err'); return; } }
  const iw = img.width, ih = img.height, V = 280, s0 = Math.max(V / iw, V / ih);
  let z = 1, ox = (V - iw * s0) / 2, oy = (V - ih * s0) / 2;
  const dlg = openHTML(`<div class="dh"><div><h3>Foto de perfil</h3><p>Arraste para enquadrar e use o controle para ampliar.</p></div><button class="ib" data-close aria-label="Fechar">${ic('x')}</button></div>
  <div class="db"><div class="pcrop"><canvas id="pc" width="${V}" height="${V}" aria-label="Área de recorte"></canvas><input id="pz" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"></div></div>
  <div class="df"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="pSave">Usar esta foto</button></div>`);
  const cv = $('#pc', dlg), ctx = cv.getContext('2d');
  const clampO = () => { const s = s0 * z; ox = clamp(ox, V - iw * s, 0); oy = clamp(oy, V - ih * s, 0); };
  const draw = () => {
    clampO(); const s = s0 * z; ctx.clearRect(0, 0, V, V); ctx.drawImage(img, ox, oy, iw * s, ih * s);
    ctx.save(); ctx.fillStyle = 'rgba(10,14,25,.55)'; ctx.beginPath(); ctx.rect(0, 0, V, V); ctx.arc(V / 2, V / 2, V / 2 - 2, 0, Math.PI * 2, true); ctx.fill('evenodd'); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(V / 2, V / 2, V / 2 - 2, 0, Math.PI * 2); ctx.stroke();
  };
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag) return; const k = V / cv.getBoundingClientRect().width; ox = drag.ox + (e.clientX - drag.x) * k; oy = drag.oy + (e.clientY - drag.y) * k; draw(); });
  cv.addEventListener('pointerup', () => { drag = null; });
  const zoomTo = nz => { const c = V / 2, s = s0 * z; const ix = (c - ox) / s, iy = (c - oy) / s; z = nz; const s2 = s0 * z; ox = c - ix * s2; oy = c - iy * s2; draw(); };
  $('#pz', dlg).addEventListener('input', e => zoomTo(+e.target.value));
  cv.addEventListener('wheel', e => { e.preventDefault(); const nz = clamp(z - e.deltaY * 0.002, 1, 4); $('#pz', dlg).value = nz; zoomTo(nz); }, { passive: false });
  draw();
  $('#pSave', dlg).onclick = () => {
    clampO(); const out = document.createElement('canvas'); out.width = out.height = 256; const o = out.getContext('2d'), k = 256 / V, s = s0 * z;
    o.fillStyle = '#fff'; o.fillRect(0, 0, 256, 256); o.imageSmoothingQuality = 'high'; o.drawImage(img, ox * k, oy * k, iw * s * k, ih * s * k);
    D().settings.photo = out.toDataURL('image/jpeg', 0.86); dlg.close(); commit('Foto de perfil atualizada');
  };
}

/** troca os rótulos genéricos pelos nomes escolhidos no Perfil (só texto visível; nunca dados) */
function applyLabels(root) {
  const st = (D() && D().settings) || {}, b = st.lblB, f = st.lblF;
  if (!b && !f) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) {
    let t = n.nodeValue; if (!t) continue; const o = t;
    if (b) t = t.replace(/Construtora/g, b).replace(/CONSTRUTORA/g, b.toUpperCase());
    if (f) t = t.replace(/Financiamento/g, f).replace(/FINANCIAMENTO/g, f.toUpperCase());
    if (t !== o) n.nodeValue = t;
  }
}

function bodyValue(key, val, unitText) {
  const u = norm(unitText || '');
  if (key === 'altura' && val < 3) return Math.round(val * 100);
  if (key === 'magra' && /kg/.test(u)) return { magraKg: val };

      const after = rest.slice(at + lab.length), m = /(-?\d+(?:[.,]\d+)*)\s*(kg|%|cm|kcal|anos|ano)?/.exec(after); if (!m) { curKey = key; found = true; break; }

  fc: ['frequencia cardiaca', 'batimentos', 'heart rate', 'bpm'],
  sono: ['sono', 'sleep', 'horas dormidas'],

  m: null, auth: null, db: null, storage: null, uid: null, timer: null, started: false, engine: null, lastPull: 0, busy: false, again: false,

        get: async () => { const s = await this.m.fs.getDoc(ref()); return view(s.exists() ? s.data() : null); },
        // transação: lê o documento, mescla com o local e só então grava (merge:true preserva campos desconhecidos do documento, ex.: "json")
        transact: fn => this.m.fs.runTransaction(this.db, async tx => { const s = await tx.get(ref()); const r = fn(view(s.exists() ? s.data() : null)); if (r.write) tx.set(ref(), r.write, { merge: true }); return r; }),

const Gate = {
  el: () => $('#gate'),
  show(kind) {
    const g = this.el(); g.classList.add('show');
    if (kind === 'loading') { g.innerHTML = `<div class="login" style="text-align:center"><div class="avatar" style="margin:0 auto 14px">K</div><div class="fw7" style="margin-bottom:10px">Keli Vida</div><div class="spin" style="margin:0 auto 14px"></div><div class="lbl" id="gmsg">Carregando…</div></div>`; return; }
    g.innerHTML = `<form class="login" id="loginForm" novalidate><div class="avatar">K</div><h2>Keli Vida</h2><p class="s">Entre para sincronizar seus dados entre aparelhos.</p>
      <div class="fld"><label for="lu">E-mail</label><input class="inp" id="lu" type="email" autocomplete="username" autocapitalize="none"></div>
      <div class="fld"><label for="lp">Senha</label><input class="inp" id="lp" type="password" autocomplete="current-password"></div>

      <button class="btn pri blk" style="padding:11px" type="submit">Entrar</button>
      <button class="btn gh blk mt8" type="button" id="gReset">Esqueci a senha</button><hr class="sep">
      <button class="btn blk" type="button" id="gLocal">Usar somente neste aparelho</button></form>`;
    $('#loginForm').onsubmit = async e => {
      e.preventDefault(); const em = $('#lu').value.trim(), pw = $('#lp').value;

      this.msg('Entrando…', true);
      try { await Cloud.login(em, pw); } catch (x) { this.msg(FBERR[x && x.code] || 'Não foi possível entrar: ' + ((x && x.code) || x)); }
    };
    $('#gReset').onclick = async () => { const em = $('#lu').value.trim(); if (!em) return this.msg('Digite seu e-mail primeiro.'); try { await Cloud.reset(em); this.msg('Enviamos um link de redefinição para o seu e-mail.', true); } catch (x) { this.msg(FBERR[x && x.code] || 'Erro ao enviar o e-mail.'); } };
    $('#gLocal').onclick = () => { UI.local = true; saveUI(); bootResolve(true); this.hide(); render(); };
  },

const bgId = (ym, cat) => 'bg-' + ym + '-' + cat;
const bgList = (ym, d = D()) => (d.budgets || []).filter(b => b.ym === ym);
const bgGet = (ym, cat, d = D()) => (d.budgets || []).find(b => b.id === bgId(ym, cat)) || null;
function bgSet(ym, cat, patch, d = D()) {

}
const bgMes = (ym = S.ym, d = D()) => { const m = bgGet(ym, '_mes', d); const cats = bgList(ym, d).filter(b => b.cat !== '_mes' && +b.limit > 0); return { meta: m, limite: m && +m.limit > 0 ? +m.limit : cats.length ? r2(sum(cats.map(b => +b.limit))) : null, cats, base: (m && m.base) || 'prevista' }; };
function usoCategoria(ym, cat, d = D()) {

  return { real, comp, vr: r2(sum(real.map(x => x.val))), vc: r2(sum(comp.map(x => x.val))) };
}
function planejado(ym = S.ym, d = D()) {
  return bgMes(ym, d).cats.map(b => { const u = usoCategoria(ym, b.cat, d), uso = r2(u.vr + u.vc), p = uso / b.limit * 100; return { b, ...u, uso, p, resto: r2(b.limit - uso), st: p >= 100 ? 'rd' : p >= 80 ? 'am' : 'gr' }; }).sort((a, c) => c.p - a.p);
}
function cPlanejado(cls = 's12') {
  const ym = S.ym, rows = planejado(ym), semOrc = porCategoria(caixa(ym).sai).filter(c => !bgGet(ym, c.cat) || !(+bgGet(ym, c.cat).limit > 0));
  return `<section class="card ${cls} c-plan">${illus('target')}<div class="ch"><span class="ttl">Planejado × realizado</span><small class="mu" style="margin-left:6px">${ymLabel(ym)}</small></div>
  <div class="lbl">Uso = <b>realizado</b> (pago no mês, data efetiva) + <b>comprometido</b> (a pagar no mês e pendências anteriores). Fatura de cartão conta só uma vez, como "Fatura de cartão".</div>
  ${rows.length ? `<div class="plr mt12">${rows.map(r => `<button class="plrow" data-act="g3cat" data-v="${esc(r.b.cat)}"><div class="rowf between"><span class="rowf" style="gap:8px"><span class="dot" style="background:${catCor(r.b.cat)}"></span><b>${esc(catNome(r.b.cat))}</b></span><span class="tnum ${r.st === 'rd' ? 'neg fw7' : 'mu'}">${r.resto < 0 ? R(-r.resto) + ' acima do limite' : R(r.uso) + ' de ' + R(r.b.limit)}</span></div>
    <div class="pbar lg ${r.st} mt8"><i style="width:${clamp(r.p, 0, 100)}%"></i></div><div class="rowf between xs mu mt4"><span>${N(r.p, 0)}% usado · pago ${R(r.vr)} · comprometido ${R(r.vc)}</span><span>${r.resto >= 0 ? 'resta ' + R(r.resto) : ''}</span></div></button>`).join('')}</div>`
    : `<div class="mt12">${emptyBox('target', 'Sem orçamento definido', 'Defina quanto pretende gastar em cada categoria neste mês. Nada é lançado nas suas finanças.', 'Definir orçamento', 'g3orc')}</div>`}
  ${semOrc.length && rows.length ? `<details class="mt12"><summary class="sm fw6" style="cursor:pointer">Categorias com gasto e sem orçamento definido (${semOrc.length})</summary><div class="mt8">${semOrc.map(c => `<div class="cat-row"><span class="dot" style="background:${catCor(c.cat)}"></span>${esc(catNome(c.cat))}<span class="v">${R(c.v)}</span><span class="p xs">Sem orçamento definido</span></div>`).join('')}</div></details>` : ''}
  <div class="rowf wrap mt16"><button class="btn sm pri" data-act="g3orc">${ic('pencil', 's')} ${rows.length ? 'Editar orçamento' : 'Definir orçamento'}</button><button class="btn sm" data-act="g3orcCopy">Copiar de ${mesNome(ymAdd(ym, -1))}</button><span class="xs mu">Subcategorias: a estrutura atual de categorias não tem subníveis.</span></div></section>`;
}
function orcForm() {

/* ---------- DISTRIBUA SUA RECEITA (mesma coleção: % sobre a base escolhida) ---------- */
function baseReceita(ym = S.ym, d = D()) { const m = bgMes(ym, d); return { tipo: m.base, v: m.base === 'recebida' ? caixa(ym, d).inc : budget(ym, d).inc }; }

   <div class="rowf between"><span class="lbl">Receita ${b.tipo === 'recebida' ? 'recebida' : 'prevista'} do mês</span><b class="md2 tnum">${R(b.v)}</b></div>
   ${parts.length && b.v > 0 ? `<div class="seg lg mt12" role="img" aria-label="Distribuição planejada">${parts.map(x => `<i style="flex:${x.v} 1 0;background:${x.cor}" title="${esc(catNome(x.cat))} ${N(x.p, 0)}%"></i>`).join('')}${resto > 0 ? `<i style="flex:${resto} 1 0;background:var(--sub2)"></i>` : ''}</div>
   <div class="dleg mt12">${parts.map(x => `<div><span class="dot" style="background:${x.cor}"></span>${esc(catNome(x.cat))} <b>${N(x.p, 0)}%</b><small class="tnum">${R(x.v)}</small></div>`).join('')}</div>
   <div class="rowf between mt12 sm"><span>Distribuído <b class="tnum">${R(tot)}</b> (${N(ptot, 0)}%)</span><span class="${resto < 0 ? 'neg fw7' : 'mu'}">${resto < 0 ? 'Excede a receita em ' + R(-resto) : 'Ainda não distribuído: ' + R(resto)}</span></div>
   ${ptot > 100 ? `<div class="g3note rd mt8">${ic('alert', 's')}<span>A distribuição passa de 100% da receita ${b.tipo}.</span></div>` : ''}`

}
function distForm() {
  const d = D(), ym = S.ym, cats = d.cats.filter(c => c.group !== 'renda'), b = baseReceita(ym, d);
  openForm({
    title: 'Distribuir a receita de ' + ymLabel(ym), sub: `Base: ${R(b.v)} (${b.tipo === 'recebida' ? 'receita já recebida' : 'receita prevista'}). Os percentuais viram limites do Planejado × realizado. Nada é lançado.`, wide: true, submit: 'Salvar distribuição',

    values: Object.assign({ base: b.tipo }, ...cats.map(c => { const r = bgGet(ym, c.id, d); return { ['p_' + c.id]: r && r.limit > 0 && b.v > 0 ? r2(r.limit / b.v * 100) : '' }; })),

/* ---------- RITMO DO MÊS ---------- */
function ritmo(ym = S.ym, d = D()) {
  const m = bgMes(ym, d), T = todayISO(), M = curYM(), di = daysIn(ym), k = caixa(ym, d);
  const gasto = k.out, comp = r2(sum(monthItems(ym, d).filter(i => i.type === 'out' && !i.paid).map(i => i.val)) + pendPrevTot(ym, d));
  const fase = ym < M ? 'fim' : ym > M ? 'fut' : 'atual', hojeD = fase === 'atual' ? +T.slice(8) : fase === 'fim' ? di : 0;
  const restDias = fase === 'atual' ? di - hojeD + 1 : fase === 'fut' ? di : 0;
  if (m.limite == null) return { cfg: false, gasto, comp, fase };
  const resto = r2(m.limite - gasto - comp), dia = restDias > 0 && resto > 0 ? r2(resto / restDias) : 0, ritmoEsp = m.limite * (hojeD / di);
  const st = resto <= 0 ? 'esg' : fase === 'fut' ? 'ok' : gasto > ritmoEsp * 1.1 ? 'acima' : gasto > ritmoEsp ? 'atn' : 'ok';
  // gasto acumulado por dia (só com data efetiva)
  const mv = movEfetivas(ym + '-01', ym + '-' + pad(di), d); let ac = 0;
  const serie = Array.from({ length: di }, (_, i) => { const dt = ym + '-' + pad(i + 1); if (dt > T) return null; ac = r2(ac + sum(mv.sai.filter(x => x.date === dt).map(x => x.val))); return ac; });
  return { cfg: true, lim: m.limite, gasto, comp, resto, dia, restDias, st, fase, serie, di, hojeD, semData: mv.semData.filter(x => x.type === 'out') };
}
const RIT = { ok: ['No ritmo certo', 'pos'], atn: ['Atenção ao orçamento', 'warn'], acima: ['Acima do planejado', 'neg'], esg: ['Orçamento esgotado', 'neg'] };
function graficoRitmo(r, compacto) {
  const W = 640, H = compacto ? 96 : 170, L = 8, Rr = 12, Tp = 14, B = compacto ? 6 : 22, mx = Math.max(r.lim, ...r.serie.filter(v => v != null), 1) * 1.08;
  const x = i => L + i * (W - L - Rr) / (r.di - 1), y = v => Tp + (1 - v / mx) * (H - Tp - B);
  const pts = r.serie.map((v, i) => v == null ? null : [x(i), y(v), v > r.lim * (i + 1) / r.di]).filter(Boolean);
  const seg = pts.slice(1).map((p, i) => `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="${p[2] ? PAL.coral : PAL.teal}" stroke-width="3" stroke-linecap="round"/>`).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto acumulado e planejamento" style="display:block;overflow:visible"><line x1="${x(0)}" y1="${y(0)}" x2="${x(r.di - 1)}" y2="${y(r.lim)}" stroke="${PAL.cinza}" stroke-width="2" stroke-dasharray="6 6"/>${compacto ? '' : `<text x="${x(r.di - 1)}" y="${y(r.lim) - 8}" text-anchor="end" font-size="12" fill="var(--mu)">Planejado ${R(r.lim)}</text>`}${seg}${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="5.5" fill="${last[2] ? PAL.coral : PAL.teal}" stroke="var(--card)" stroke-width="2"/>` : ''}</svg>`;
}
function cRitmo(cls = 's6', compacto = false) {
  const r = ritmo();
  if (!r.cfg) return `<section class="card ${cls} c-rit ${compacto ? 'cmp' : ''}"><div class="ch"><span class="ttl">Ritmo do mês</span></div><div class="lbl mt4">Orçamento não configurado</div><div class="mt8 sm">Defina um limite para ${mesNome(S.ym)} e o app mostra quanto ainda cabe por dia, descontando o que já foi pago e o que está comprometido.</div><div class="rowf wrap mt12"><button class="btn sm pri" data-act="g3orc">${ic('plus', 's')} Definir orçamento</button></div></section>`;
  const [stl, stc] = RIT[r.st];
  const frase = r.fase === 'fim' ? `Mês encerrado · ${r.resto >= 0 ? 'sobrou ' + R(r.resto) : 'passou ' + R(-r.resto)}` : r.st === 'esg' ? `Não há mais orçamento disponível${r.resto < 0 ? ' — ' + R(-r.resto) + ' acima' : ''}` : `Você ainda pode gastar <b class="${stc}">${R(r.dia)}</b> por dia`;
  const chip = `<span class="chip ${stc === 'pos' ? 'ok' : stc === 'warn' ? 'am' : 'cor'}">${stl}</span>`;
  return `<section class="card ${cls} c-rit ${compacto ? 'cmp' : ''}"><div class="ch"><span class="ttl">Ritmo do mês</span><span class="grow"></span>${compacto ? `<button class="ib" data-act="g3fin" data-v="plan" aria-label="Ver planejamento">${ic('right', 's')}</button>` : chip}</div>
  ${compacto ? `<div class="mt4">${chip}</div>` : ''}<div class="${compacto ? 'sm' : 'rit-f'} mt8">${frase}</div><div class="mt8">${graficoRitmo(r, compacto)}</div>
  ${compacto ? '' : `<div class="kpis mt12"><div class="kpi"><div class="l">Orçamento</div><div class="n tnum">${R(r.lim)}</div></div><div class="kpi"><div class="l">Já gasto</div><div class="n tnum neg">${R(r.gasto)}</div></div><div class="kpi"><div class="l">Comprometido</div><div class="n tnum warn">${R(r.comp)}</div></div><div class="kpi"><div class="l">Restante</div><div class="n tnum ${sgnCls(r.resto)}">${R(r.resto)}</div><div class="s">${r.restDias} dia${r.restDias === 1 ? '' : 's'} restante${r.restDias === 1 ? '' : 's'}</div></div></div>
  <div class="xs mu mt8">Restante = orçamento − pago no mês − comprometido (a pagar + pendências anteriores). Receitas futuras não entram. Pagamentos sem data efetiva entram no "já gasto" pelo mês de competência (regra existente), mas não na linha diária.</div>${avisoSemData(r.semData)}`}</section>`;
}

/* ---------- ALERTAS (central de notificações existente + orçamento) ---------- */
const ALERT_TIPOS = [['late', 'Contas atrasadas'], ['due', 'Contas próximas do vencimento'], ['c80', 'Categoria em 80% do orçamento'], ['c100', 'Categoria em 100% do orçamento'], ['cover', 'Orçamento ultrapassado'], ['neg', 'Risco de fluxo negativo'], ['outros', 'Agenda e treinos']];
function alertasFin(d = D()) {

    const t = r.p > 100 ? 'cover' : r.p >= 100 ? 'c100' : r.p >= 80 ? 'c80' : null; if (!t) return;
    out.push({ key: `orc:${ym}:${r.b.cat}:${t}`, tipo: t, ic: 'alert', c: t === 'c80' ? 'am' : 'rd', act: 'g3cat', v: r.b.cat,

  });
  const f = fluxoDiario({ a: ym + '-01', b: ym + '-' + pad(daysIn(ym)), p: 'mes', l: '' }, d);
  if (f.fut.length && f.fim < 0) out.push({ key: `neg:${ym}`, tipo: 'neg', ic: 'alert', c: 'rd', act: 'g3fin', v: 'fluxo', t: 'Risco de fluxo negativo no mês', s: `A projeção termina ${mesNome(ym)} em ${R(f.fim)}.` });
  return out;
}

/* ---------- INSIGHTS (só cálculos locais e rastreáveis) ---------- */
function insights(d = D()) {

}

      for (let k = i; k < top; k++) b.set(dref('demos', m.sha, 'parts', pid(k)), { i: k, b: fs().Bytes.fromUint8Array(u8.subarray(k * CH, Math.min(buf.byteLength, (k + 1) * CH))) });
      await b.commit(); quota('w', top - i);
      await fs().updateDoc(dref('demos', m.sha), { up: top }); quota('w', 1);
    }
    await fs().updateDoc(dref('demos', m.sha), { up: n, done: true, at: Date.now() }); quota('w', 1);
    st.cat = { ...(st.cat || {}), [m.sha]: { ...meta, up: n, done: true } }; lsSet({ ...lsGet(), cat: st.cat });
  }
  async function link(exId, v) {
    const m = DEMO_MAP[exId]; if (!m || !ok() || !canWrite()) return;
    try { await fs().setDoc(dref('demoLinks', exId), { ex: exId, sha: m.sha, ok: v || '', st: m.st, at: Date.now() }); quota('w', 1); st.links = { ...(st.links || {}), [exId]: { ex: exId, sha: m.sha, ok: v || '' } }; lsSet({ ...lsGet(), links: st.links }); } catch (e) { hold(e); }
  }
  async function push() {
    if (st.up || !ok()) return; st.up = true; st.s = 'up';
    try {
      if (!(await catalog(false))) return;
      for (const exId of Object.keys(DEMO_URLS)) {
        if (st.paused) break; try { await sendOne(exId); } catch (e) { hold(e); break; }
      }
      const L = st.links || {};
      for (const exId of Object.keys(DEMO_MAP)) {
        const m = DEMO_MAP[exId], v = (UI.demoOk || {})[exId], c = st.cat && st.cat[m.sha]; if (!m.sha || !(c && c.done === true)) continue;
        const cur = L[exId]; if (cur && cur.sha === m.sha && (cur.ok || '') === (v || '')) continue;
        await link(exId, v || '');
      }
    } finally { st.up = false; st.s = 'idle'; paint(); }
  }
  async function start() {
    if (!Cloud.uid) return;
    try { st.started = true; await demoLoadLocal(); await catalog(false); paint(); await push(); } catch (e) { hold(e); }
  }
  function label(exId) {
    if (!Cloud.uid) return 'Não importada';
    const f = st.fail[exId]; if (st.q.includes(exId) || st.s === 'down') return 'Recuperando…';
    return f && f.off ? 'Não disponível offline' : 'Não importada';
  }
  function line() {
    if (!Cloud.uid) return '';
    const t = st.paused ? 'Cota gratuita do dia atingida; sincronização pausada' : st.err && !st.run && !st.up ? 'Erro de sincronização' : st.s === 'up' ? 'Enviando demonstrações' : st.s === 'down' ? 'Recuperando demonstrações' : navigator.onLine === false ? 'Disponível offline' : (st.cat ? 'Sincronizado com a nuvem' : 'Aguardando a nuvem');
    return `<div class="xs mu mt8">${emo('☁️')} ${t}${DEMO_LOCAL.n && st.s === 'idle' && !st.paused ? ' · Disponível offline' : ''}</div>`;
  }
  return { start, want, push, link, label, line, state: st, _catalog: catalog };
})();

(function boot() {
  setTheme(UI.theme || 'light');
  S.loading = true; render();
  if (!UI.local) Gate.show('loading');
  setTimeout(() => { S.loading = false; render({ anim: true }); }, 450);
  Cloud.init();
  if (!UI.local) setTimeout(() => { if (Gate.el().classList.contains('show') && !Cloud.uid && !$('#loginForm')) Gate.offline(); }, 7000);
  // nunca permitir que o contexto de demonstração persista entre sessões
  window.addEventListener('pagehide', () => { if (Store.mode === 'demo') { Store.demo = null; Store.mode = 'real'; } });
})();
</script>
